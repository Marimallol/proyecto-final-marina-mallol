[pytest]
testpaths = tests
pythonpath = src
addopts = -ra --html=reports/report.html --self-contained-html
markers =
    ui: browser-driven tests
    api: HTTP API tests
    negative: invalid-input or error-path tests
log_cli = true
log_cli_level = INFO
log_file = reports/pytest.log
log_file_level = INFO
